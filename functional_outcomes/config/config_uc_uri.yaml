# BertPCa — UC recovery (ICIQ = 0) using ICIQ-SF longitudinal data from URI export
# Dynamic feature: iciq_sf_tot (instead of psa) — ICIQ-SF total score at each post-RRP visit
# Matching: patientID from Milan RData = P_1_id from URI export

seed: 42

data_dir: "functional_outcomes/data"
train_path: "uri_uc_train.csv"
val_path:   "uri_uc_val.csv"
test_path:  "uri_uc_test.csv"

static_features:
  - nerve_sparing
  - IPSS_pre
  - age
  - tpsa
  - bmi
  - pathgg_group
  - ece_bin
  - svi_bin
  - psm
  - prostate_vol
  - operative_time
  - QoL_pre
  - drs_max
  - psa_nadir
  - time_to_nadir
  - psa_at_last_obs
  - psa_slope
  - n_psa_obs

dynamic_features:
  - times
  - iciq_sf_tot

batch_size: 32
seq_length: 16
t_max: 365.0
augment_data: true
scale_features: true

model:
  learning_rate: 5.0e-5
  num_encoder_layers: 1
  intermediate_dim: 64
  num_heads: 2
  num_conv_blocks: 1
  filters: 32
  kernel_size: 3
  pool_strides: 2
  pool_size: 3
  num_dense_layers: 1
  dense_units: 64
  activation: "relu"
  norm_epsilon: 1.0e-5
  dropout: 0.3
  gamma: 0.0

training:
  epochs: 200
  early_stopping_patience: 20
  reduce_lr_patience: 7
  reduce_lr_factor: 0.5
  min_lr: 1.0e-6
  verbose: "auto"

evaluation:
  # p_times aligned with typical URI visit schedule: FUP40 (~40d), 3mo, 6mo
  p_times: [45, 90, 180]
  e_times: [90, 180, 365]

tuning:
  n_trials: 100
  direction: "minimize"
  study_name: "bertpca_uc_uri_optuna_study"

output_dir: "functional_outcomes/outputs"
model_dir:  "functional_outcomes/outputs/models"
results_dir: "functional_outcomes/outputs/results/uc_uri"
